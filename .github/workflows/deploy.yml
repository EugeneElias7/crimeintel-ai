name: Deploy to Catalyst

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy frontend to Catalyst Hosting
        run: |
          # TODO: Replace with actual Catalyst CLI deploy command
          # npx catalyst-cli deploy hosting --project ${{ secrets.CATALYST_PROJECT_ID }} --dir dist
          echo "Frontend built and ready for Catalyst deployment"
        working-directory: frontend

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t catalyst_build/
        working-directory: backend

      - name: Package and deploy backend to Catalyst Functions
        run: |
          # TODO: Replace with actual Catalyst CLI deploy command
          # npx catalyst-cli deploy function --project ${{ secrets.CATALYST_PROJECT_ID }} --path catalyst_build
          echo "Backend packaged and ready for Catalyst deployment"
        working-directory: backend
        env:
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
          CATALYST_PERSONAL_ACCESS_TOKEN: ${{ secrets.CATALYST_PERSONAL_ACCESS_TOKEN }}
