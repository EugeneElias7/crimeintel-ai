<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="CrimeIntel AI Industrial Badge">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer industrial badge – 7-point KSP-style star shield -->
  <path d="M60 6 L78 16 L96 18 L88 36 L96 54 L88 72 L96 90 L78 100 L60 112 L42 100 L24 90 L32 72 L24 54 L32 36 L24 18 L42 16 Z" fill="url(#steel)" stroke="url(#bevel)" stroke-width="2.2" filter="url(#depth)"/>
  <!-- Inner shield plate -->
  <path d="M60 18 L80 26 L80 62 C80 78 70 92 60 100 C50 92 40 78 40 62 L40 26 Z" fill="url(#inner)" stroke="#334155" stroke-width="1.1"/>
  <!-- Bevel highlight -->
  <path d="M60 18 L80 26 L80 62 C80 78 70 92 60 100" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.2"/>
  <!-- Brushed metal highlight -->
  <path d="M42 28 L78 28" stroke="white" stroke-opacity="0.06" stroke-width="0.7"/>
  <path d="M38 36 L82 36" stroke="white" stroke-opacity="0.04" stroke-width="0.5"/>
  <!-- Rivets – industrial -->
  <circle cx="60" cy="14" r="1.6" fill="#64748B" stroke="#475569" stroke-width="0.6"/>
  <circle cx="28" cy="22" r="1.4" fill="#64748B" stroke="#475569" stroke-width="0.6"/>
  <circle cx="92" cy="22" r="1.4" fill="#64748B" stroke="#475569" stroke-width="0.6"/>
  <circle cx="28" cy="86" r="1.4" fill="#64748B" stroke="#475569" stroke-width="0.6"/>
  <circle cx="92" cy="86" r="1.4" fill="#64748B" stroke="#475569" stroke-width="0.6"/>
  <circle cx="60" cy="106" r="1.6" fill="#F59E0B" stroke="#92400E" stroke-width="0.5"/>
  <!-- Central CI monogram – industrial stencil -->
  <g font-family="JetBrains Mono, monospace" font-weight="800" text-anchor="middle" dominant-baseline="middle">
    <text x="60" y="52" font-size="22" fill="white" letter-spacing="-1.5" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6))">CI</text>
    <rect x="52" y="62" width="16" height="9" rx="1.2" fill="#F59E0B" stroke="#92400E" stroke-width="0.6"/>
    <text x="60" y="68.5" font-size="6.5" font-weight="800" fill="#1E293B" letter-spacing="1.2" text-anchor="middle">AI</text>
  </g>
  <!-- Crosshair – intelligence -->
  <g fill="none" stroke="#38BDF8" stroke-width="0.9" opacity="0.85">
    <circle cx="60" cy="48" r="14" stroke-opacity="0.4"/>
    <path d="M60 38 L60 42 M60 54 L60 58 M50 48 L54 48 M66 48 L70 48" stroke-width="1.1"/>
    <circle cx="60" cy="48" r="1.2" fill="#38BDF8" stroke="none" opacity="1"/>
  </g>
  <!-- Fingerprint micro-arc – forensic -->
  <g fill="none" stroke="white" stroke-width="0.6" opacity="0.18">
    <path d="M48 48 C46 48 44 50 44 54 C44 58 47 62 50 64"/>
    <path d="M72 48 C74 48 76 50 76 54 C76 58 73 62 70 64"/>
  </g>
  <!-- KSP banner -->
  <g font-family="Inter, sans-serif" font-weight="700" text-anchor="middle">
    <text x="60" y="83" font-size="5" fill="#94A3B8" letter-spacing="1.6">K S P</text>
  </g>
</svg>
